name: Sandbox e2e

# A fresh kind cluster with gVisor, the sandbox applied, and
# tests/e2e/run.sh against it: the demo agent hijacked by its tool's answer,
# admission refusing each planted manifest, both network walls, and the
# memory limit held.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Fresh cluster, every check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      # Under gVisor, on a node with swap, a pod's memory limit is its RAM
      # plus unlimited swap (docs/threat-model.md). Production nodes run
      # without it, and so does this one. The log shows what the runner had.
      - name: No swap, as on a production node
        run: |
          echo "before:"; cat /proc/swaps
          sudo swapoff -a
          echo "after:"; cat /proc/swaps

      - name: Create the kind cluster
        run: kind create cluster --config kind/cluster.yaml --wait 120s

      - name: Install gVisor
        run: ./scripts/install-gvisor.sh

      - name: Apply the sandbox
        run: |
          kubectl apply -k manifests/
          kubectl -n tools rollout status deployment/tool-gateway --timeout=180s
          kubectl -n corp rollout status deployment/internal-records --timeout=180s

      - name: Run the checks
        env:
          E2E_RESULTS: ${{ runner.temp }}/e2e-results.json
        run: ./tests/e2e/run.sh

      - name: Keep the results for the status workflow
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: ${{ runner.temp }}/e2e-results.json
          if-no-files-found: ignore
          retention-days: 30

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -40
          kubectl -n agents logs job/agent-demo || true
