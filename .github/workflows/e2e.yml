name: Sandbox e2e

# A fresh kind cluster with gVisor, the sandbox applied, and
# tests/e2e/run.sh against it: the demo agent hijacked by its tool's answer,
# admission refusing each planted manifest, both network walls, and the
# memory limit held.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Fresh cluster, every check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the pinned tools
        run: ./scripts/install-tools.sh >> "$GITHUB_PATH"

      # GitHub's runners have swap. Under gVisor a pod's memory limit is
      # then RAM plus unlimited swap (docs/threat-model.md); production
      # nodes run without it, and so does this one.
      - name: No swap, as on a production node
        run: sudo swapoff -a && cat /proc/swaps

      - name: Create the kind cluster
        run: kind create cluster --config kind/cluster.yaml --wait 120s

      - name: Install gVisor
        run: ./scripts/install-gvisor.sh

      - name: Apply the sandbox
        run: |
          kubectl apply -k manifests/
          kubectl -n tools rollout status deployment/tool-gateway --timeout=180s
          kubectl -n corp rollout status deployment/internal-records --timeout=180s

      - name: Run the checks
        run: ./tests/e2e/run.sh

      - name: What the cluster looked like
        if: failure()
        run: |
          kubectl get pods -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -40
          kubectl -n agents logs job/agent-demo || true
