# Stands for every internal service an agent has no business reaching:
# another team's API, a database, a secrets store.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: internal-records
  namespace: corp
  labels:
    app.kubernetes.io/name: internal-records
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: internal-records
  template:
    metadata:
      labels:
        app.kubernetes.io/name: internal-records
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0@sha256:ec73780a8425f59ea49f5bc8cdff0d598805a224fbaa1f86c67a244f250fa9da
          command: [./podinfo]
          args: [--port=9898, --level=info]
          env:
            - name: PODINFO_UI_MESSAGE
              value: "Internal records. An agent should never see this line."
          ports:
            - {name: http, containerPort: 9898}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
apiVersion: v1
kind: Service
metadata:
  name: internal-records
  namespace: corp
spec:
  selector:
    app.kubernetes.io/name: internal-records
  ports:
    - {name: http, port: 9898, targetPort: http}
