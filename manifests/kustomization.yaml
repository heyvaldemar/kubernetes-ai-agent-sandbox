# Everything the sandbox is made of. The demo agent's Job is applied on its
# own (agent/job.yaml), because a Job runs once and a re-apply of a finished
# one is refused.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - runtimeclass.yaml
  - namespaces.yaml
  - agent-dns.yaml
  - admission.yaml
  - mcp/mcp.yaml
  - tools.yaml
  - corp.yaml
  - records/records.yaml
  - network-policies.yaml
  - quota.yaml
configMapGenerator:
  - name: agent-script
    namespace: agents
    files:
      - agent/agent.py
  - name: mcp-server
    namespace: mcp
    files:
      - mcp/server.py
      - mcp/policy.json
  - name: records-api
    namespace: corp
    files:
      - records/records_api.py
generatorOptions:
  disableNameSuffixHash: true
