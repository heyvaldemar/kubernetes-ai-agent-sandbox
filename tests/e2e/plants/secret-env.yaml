# expect: an agent pod takes no Secret into its environment
# A key in the agent's environment is a key a fooled agent can send. The MCP
# server holds the credentials its tools need; the agent asks it for results.
apiVersion: v1
kind: Pod
metadata:
  name: secret-env
  namespace: agents
spec:
  runtimeClassName: gvisor
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: agent
      image: docker.io/library/busybox:1.37@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
      command: [sleep, "60"]
      resources:
        requests: {cpu: 10m, memory: 16Mi}
        limits: {cpu: 100m, memory: 32Mi}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      env:
        - name: RECORDS_KEY
          valueFrom:
            secretKeyRef: {name: records-api-key, key: key}
